<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16141f">
<title>Proxie Maker</title>
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button class="btn icon only-mobile" id="btn-side" title="Drucklisten">☰</button>
  <div class="brand"><img src="icon.svg" alt=""><span class="hide-mobile">Proxie Maker</span></div>
  <nav class="tabs"><button data-tab="list" class="active">Drucklisten</button><button data-tab="deck">Decks</button></nav>
  <span class="spacer"></span>
  <span class="muted small hide-mobile">Proxies nur für den Eigengebrauch</span>
  <button class="btn icon" id="btn-settings" title="Einstellungen">⚙</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="row"><h3 id="side-title">Drucklisten</h3><span class="spacer"></span><button class="btn small primary" id="btn-new">＋ Neu</button></div>
    <div id="project-list" class="project-list"></div>
  </aside>
  <main class="content" id="main"></main>
</div>

<div id="login" class="login hidden">
  <form class="login-box" id="login-form">
    <img src="icon.svg" alt="" width="56">
    <h2>Proxie Maker</h2>
    <p class="muted">Zugangs-Token eingeben.<br>Am Server: <code>sudo proxie-maker-server --show-token</code></p>
    <input id="login-token" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters">
    <button class="btn primary">Anmelden</button>
  </form>
</div>

<div id="toasts" class="toasts"></div>
<script src="app.js"></script>
<script src="editor.js"></script>
</body>
</html>
