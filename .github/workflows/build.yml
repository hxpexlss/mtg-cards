name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python:
    name: Tests + .deb-Pakete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -W ignore -m unittest discover -s tests -v
      - name: .deb bauen
        run: ./packaging/build-debs.sh
      - name: Installation testen (Server)
        run: |
          sudo apt-get install -y ./dist/mtg-cards-server_*_all.deb
          sleep 2
          systemctl status mtg-cards-server --no-pager
          TOKEN=$(sudo mtg-cards-server --show-token)
          curl -sf http://127.0.0.1:8765/api/health
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8765/api/stats
      - uses: actions/upload-artifact@v4
        with:
          name: deb-pakete
          path: dist/*.deb

  android:
    name: Android-APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit-Tests + APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../mtg-cards-scanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mtg-cards-scanner.apk

  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
