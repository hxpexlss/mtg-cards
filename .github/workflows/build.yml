name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python:
    name: Tests + .deb-Pakete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -W ignore -m unittest discover -s tests -v
      - name: .deb bauen
        run: ./packaging/build-debs.sh
      - name: Installation testen (Server)
        run: |
          sudo apt-get install -y ./dist/mtg-cards-server_*_all.deb
          sleep 2
          systemctl status mtg-cards-server --no-pager
          TOKEN=$(sudo mtg-cards-server --show-token)
          curl -sf http://127.0.0.1:8765/api/health
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8765/api/stats
          echo "--- HTTPS"
          sudo mtg-cards-server --enable-tls
          sudo systemctl restart mtg-cards-server
          sleep 2
          systemctl status mtg-cards-server --no-pager
          curl -skf https://127.0.0.1:8765/api/health
      - uses: actions/upload-artifact@v4
        with:
          name: deb-pakete
          path: dist/*.deb

  android:
    name: Android-APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit-Tests + APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../mtg-cards-scanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mtg-cards-scanner.apk

  windows:
    name: Windows (Desktop + Server)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: python -m pip install --upgrade pip pyinstaller cryptography
      - name: Tests unter Windows
        run: python -W ignore -m unittest discover -s tests -v
      - name: Version ermitteln
        id: ver
        shell: bash
        run: echo "version=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('mtgcards/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - name: Programme bauen (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --distpath dist/windows --workpath build/pyi --name mtg-cards-desktop --windowed --icon packaging/windows/mtg-cards.ico --add-data "mtgcards/web;mtgcards/web" --paths . packaging/windows/desktop_entry.py
          pyinstaller --noconfirm --distpath dist/windows --workpath build/pyi --name mtg-cards-server --console --icon packaging/windows/mtg-cards.ico --add-data "mtgcards/web;mtgcards/web" --paths . packaging/windows/server_entry.py
      - name: Funktionstest der fertigen Programme
        shell: pwsh
        run: |
          $tmp = $env:RUNNER_TEMP
          $srv = "dist\windows\mtg-cards-server\mtg-cards-server.exe"
          $cfg = Join-Path $tmp "server.json"
          & $srv --version
          $token = & $srv --config $cfg --show-token
          Write-Output "Token: $token"
          $p = Start-Process -FilePath $srv -ArgumentList "--config `"$cfg`" --port 8799 --db `"$tmp\s.db`" --no-discovery --log `"$tmp\server.log`"" -PassThru
          Start-Sleep -Seconds 6
          $health = Invoke-RestMethod http://127.0.0.1:8799/api/health
          if ($health.app -ne "mtg-cards") { throw "Server antwortet nicht" }
          $stats = Invoke-RestMethod http://127.0.0.1:8799/api/stats -Headers @{ Authorization = "Bearer $token" }
          Write-Output "Server OK: Version $($health.version), $($stats.cards) Karten"
          $web = Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing
          if ($web.Content -notmatch "MTG Cards") { throw "Weboberfläche fehlt" }
          if ($health.version -ne "${{ steps.ver.outputs.version }}") { throw "Falsche Version: $($health.version)" }
          # Ungültige Eingaben müssen eine verständliche 400-Antwort liefern (kein interner Fehler)
          $bad = $null
          try { Invoke-RestMethod "http://127.0.0.1:8799/api/cards?limit=abc" -Headers @{ Authorization = "Bearer $token" } } catch { $bad = $_.Exception.Response.StatusCode.value__ }
          if ($bad -ne 400) { throw "Ungültige Eingabe sollte 400 liefern, war: $bad" }
          # Derselbe Port darf unter Windows nicht ein zweites Mal belegt werden können
          $second = Start-Process -FilePath $srv -ArgumentList "--config `"$cfg`" --port 8799 --db `"$tmp\s2.db`" --no-discovery --log `"$tmp\server2.log`"" -PassThru
          if (-not $second.WaitForExit(15000)) { Stop-Process -Id $second.Id -Force; throw "Zweiter Server auf demselben Port ist nicht abgebrochen" }
          if ($second.ExitCode -eq 0) { throw "Zweiter Server auf demselben Port meldete keinen Fehler" }
          Write-Output "Port-Schutz OK:"; Get-Content "$tmp\server2.log"
          $again = Invoke-RestMethod http://127.0.0.1:8799/api/health
          if ($again.app -ne "mtg-cards") { throw "Erster Server antwortet nach dem Port-Test nicht mehr" }
          Stop-Process -Id $p.Id -Force
          Get-Content "$tmp\server.log"
          # HTTPS: Zertifikat ohne openssl erzeugen (Paket cryptography in der .exe) und verschlüsselt starten
          & $srv --config $cfg --enable-tls
          if ($LASTEXITCODE -ne 0) { throw "--enable-tls fehlgeschlagen" }
          $t = Start-Process -FilePath $srv -ArgumentList "--config `"$cfg`" --port 8797 --db `"$tmp\s.db`" --no-discovery --log `"$tmp\server-tls.log`"" -PassThru
          Start-Sleep -Seconds 6
          $th = Invoke-RestMethod https://127.0.0.1:8797/api/health -SkipCertificateCheck
          if (-not $th.tls) { throw "HTTPS ist nicht aktiv" }
          Write-Output "HTTPS OK"
          Stop-Process -Id $t.Id -Force
          & $srv --config $cfg --disable-tls
          # Desktop-Programm im Server-Modus (ohne Fenster) starten und prüfen
          $dcfg = Join-Path $tmp "desktop.json"
          $d = Start-Process -FilePath "dist\windows\mtg-cards-desktop\mtg-cards-desktop.exe" -ArgumentList "--config `"$dcfg`" --port 8798 --server-only" -PassThru
          Start-Sleep -Seconds 6
          $dh = Invoke-RestMethod http://127.0.0.1:8798/api/health
          if ($dh.kind -ne "desktop") { throw "Desktop-Server antwortet nicht" }
          Write-Output "Desktop OK: $($dh.kind) $($dh.version)"
          Stop-Process -Id $d.Id -Force
      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress | Out-Null
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\windows\mtg-cards.iss
          Compress-Archive -Path dist\windows\mtg-cards-desktop, dist\windows\mtg-cards-server -DestinationPath "dist\MTG-Cards-Windows-portable-${{ steps.ver.outputs.version }}.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/MTG-Cards-Setup-*.exe
            dist/MTG-Cards-Windows-portable-*.zip

  release:
    name: GitHub-Release
    # Release bei Versions-Tags, manuellem Start oder Push auf den Entwicklungs-Branch
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_name == 'claude/magic-cards-scanner-app-q6kz58') ||
      (github.event_name == 'push' && github.ref_name == 'claude/windows-build')
    needs: [python, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version ermitteln
        id: ver
        run: echo "version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('mtgcards/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release-Notes
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "claude/windows-build" ]; then
            # Windows-Vorschau: eigenes Release nur mit den Windows-Dateien
            cp packaging/windows/RELEASE_NOTES.md release-notes.md
            find out -type f ! -name 'MTG-Cards-*' -delete
          else
            python3 .github/scripts/release_notes.py --version ${{ steps.ver.outputs.version }} --out release-notes.md
          fi
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}${{ github.ref_name == 'claude/windows-build' && '-windows' || '' }}
          name: MTG Cards ${{ steps.ver.outputs.version }}${{ github.ref_name == 'claude/windows-build' && ' (Windows-Vorschau)' || '' }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ github.ref_name == 'claude/windows-build' && 'false' || 'true' }}
          prerelease: ${{ github.ref_name == 'claude/windows-build' }}
          overwrite_files: true
          body_path: release-notes.md
          files: out/*
      - name: Release-Notes aller Versionen aktualisieren
        if: github.ref_name != 'claude/windows-build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_notes.py --sync
