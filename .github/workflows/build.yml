name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python:
    name: Tests + .deb-Pakete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -W ignore -m unittest discover -s tests -v
      - name: .deb bauen
        run: ./packaging/build-debs.sh
      - name: Installation testen (Server)
        run: |
          sudo apt-get install -y ./dist/mtg-cards-server_*_all.deb
          sleep 2
          systemctl status mtg-cards-server --no-pager
          TOKEN=$(sudo mtg-cards-server --show-token)
          curl -sf http://127.0.0.1:8765/api/health
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8765/api/stats
          echo "--- HTTPS"
          sudo mtg-cards-server --enable-tls
          sudo systemctl restart mtg-cards-server
          sleep 2
          systemctl status mtg-cards-server --no-pager
          curl -skf https://127.0.0.1:8765/api/health
      - uses: actions/upload-artifact@v4
        with:
          name: deb-pakete
          path: dist/*.deb

  android:
    name: Android-APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit-Tests + APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../mtg-cards-scanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mtg-cards-scanner.apk

  release:
    name: GitHub-Release
    # Release bei Versions-Tags, manuellem Start oder Push auf den Entwicklungs-Branch
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_name == 'claude/magic-cards-scanner-app-q6kz58')
    needs: [python, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version ermitteln
        id: ver
        run: echo "version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('mtgcards/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: MTG Cards ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            **Downloads**
            - `mtg-cards-scanner.apk` – Android-App (Karten scannen, Sammlung durchsuchen)
            - `mtg-cards-desktop_${{ steps.ver.outputs.version }}_all.deb` – Linux-Desktop: `sudo apt install ./mtg-cards-desktop_*.deb`
            - `mtg-cards-server_${{ steps.ver.outputs.version }}_all.deb` – Ubuntu-Server: `sudo apt install ./mtg-cards-server_*.deb`, Token: `sudo mtg-cards-server --show-token`

            Anleitung: siehe README.
          files: out/*
